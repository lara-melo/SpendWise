<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - My Money Control</title>

  <!-- Estilos Globais do App -->
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="../imagens/logos/logo5.png" type="image/x-icon">

  <!-- Fontes (Inter) e Ícones (FontAwesome) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background-color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }

    .login-container {
      background-color: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .login-container h2 {
      color: #0B1B2B;
      margin-bottom: 24px;
      font-weight: 700;
    }

    .login-container .logo {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .login-container .logo img {
      height: 40px;
      width: auto;
    }

    .login-container .logo h1 {
      color: #0B1B2B;
      font-size: 1.5rem;
      margin: 0;
    }

    .login-container .logo h1 span {
      color: #10B981; /* Opcional: mantendo a cor destaque */
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #0B1B2B;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #0B1B2B;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: #0B1B2B;
      color: #FFFFFF;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-bottom: 15px;
    }

    .btn-login:hover {
      background-color: #1a2c3f;
    }

    .login-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .login-actions a {
      color: #0B1B2B;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .login-actions a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <div class="logo">
      <img src="../imagens/logos/logo6.png" alt="SpendWise Logo" style="height: 60px; width: auto;">
      <h1 style="font-size: 2rem;">Spend<span>Wise</span></h1>
    </div>

    <h2>Acesso ao Sistema</h2>

    <div id="msg-container" style="margin-bottom: 15px; font-size: 0.9rem; font-weight: 500; padding: 10px; border-radius: 6px; display: none;"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div style="position: relative;">
          <input type="password" id="password" placeholder="Sua senha" required style="padding-right: 40px; width: 100%; box-sizing: border-box;">
          <i class="fa-solid fa-eye" id="togglePassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b;"></i>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btn-submit">Login</button>
    </form>

    <div class="login-actions">
      <a href="#" id="link-register">Cadastrar Novo Usuário</a>
      <a href="#" id="link-recover">Recuperar Senha</a>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
</body>

</html>
